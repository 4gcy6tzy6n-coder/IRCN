contract_id: IRCN-v0.3.4b-exact-exogenous-input-candidate
status: FROZEN_BEFORE_CALIBRATION
supersedes: contracts/V03_4_EXACT_INPUT_CALIBRATION.yaml
reason_for_new_calibration_seeds: Calibration seed 211 was exposed to a short candidate diagnostic before the full calibration protocol; it is excluded from this calibration set.
scope:
  graph_families: [chain, star, feedback_ring, modular_sparse]
  population_sizes: [16, 64, 128]
  tasks: [smooth, sparse_pulse, dense_burst, state_switch]
  calibration_seeds: [241, 251]
  confirmatory_seeds: [311, 331, 337, 347, 349]
