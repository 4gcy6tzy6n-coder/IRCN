contract_id: IRCN-v0.3.6-WP2-single-failure-diagnostic-v1
status: FROZEN_V1_AFTER_INDEPENDENT_PROTOCOL_ACCEPT
normative_protocol: model/v0.3.6/DIAGNOSTIC_PROTOCOL_v1.md
parent_decision: WP2_INCONCLUSIVE_WP3_BLOCKED
purpose: >-
  Diagnose the single frozen validation instance whose v0.3.5 candidate full-trace
  accuracy exceeded its inherited WP1 bound. This is a nonconfirmatory root-cause
  diagnostic, not a repair search or a new WP2 result.
claim_boundary: >-
  Results may identify implementation sensitivity on this one instance only.
  They cannot change the WP2 gate, establish predictor validity, authorize WP3,
  establish speed, or support biological/causal/task-utility claims.
